pcm.!default {
    type plug
    slave.pcm {
        type rate
        slave {
            format S16_LE
            rate 48000
            pcm {
                type file
                file "/dev/MrAudio"
                format "raw"
                slave.pcm {
                    type hw
                    card 0
                    device 0
                }
            }
        }
    }
    hint {
        show on
        description "MiSTer FPGA audio"
    }
}
pcm.front pcm.default
ctl.hw {
    @args [ CARD ]
    @args.CARD { type string }
    type hw
    card $CARD
}
